<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Town of Silicon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        color: #ffffff;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Main game canvas - chatbot-centric layout */
      #game-canvas {
        flex: 1;
        display: block;
        width: 100%;
        height: 100%;
        background: #2a2a2a;
      }

      /* Loading screen */
      #loading {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      #loading.hidden {
        display: none;
      }

      .loading-text {
        font-size: 24px;
        margin-bottom: 20px;
        color: #4CAF50;
      }

      .loading-bar {
        width: 300px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        overflow: hidden;
      }

      .loading-progress {
        height: 100%;
        background: #4CAF50;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { width: 30%; }
        50% { width: 80%; }
      }

      /* Overlay buttons (for role actions) - positioned on canvas */
      .action-button {
        position: absolute;
        padding: 12px 24px;
        background: rgba(76, 175, 80, 0.9);
        border: 2px solid #4CAF50;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
      }

      .action-button:hover {
        background: rgba(76, 175, 80, 1);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(76, 175, 80, 0.5);
      }

      .action-button:active {
        transform: translateY(0);
      }

      .action-button.disabled {
        background: rgba(100, 100, 100, 0.5);
        border-color: #666;
        cursor: not-allowed;
        opacity: 0.5;
      }

      .action-button.disabled:hover {
        transform: none;
        box-shadow: none;
      }

      /* Debug info */
      #debug-info {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 4px;
        font-size: 12px;
        font-family: monospace;
        z-index: 100;
      }

      #debug-info.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Loading screen -->
      <div id="loading">
        <div class="loading-text">Loading Town of Silicon...</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
        <div style="margin-top: 20px; font-size: 14px; color: #888;">
          Initializing 64K context AI players...
        </div>
      </div>

      <!-- Main game canvas - chatbot-centric UI rendered here -->
      <canvas id="game-canvas"></canvas>

      <!-- Debug info (toggle with `) -->
      <div id="debug-info" class="hidden">
        <div>FPS: <span id="fps">60</span></div>
        <div>Canvas: <span id="canvas-size">0x0</span></div>
        <div>Phase: <span id="current-phase">-</span></div>
        <div>AIs Loaded: <span id="ai-count">0</span></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
