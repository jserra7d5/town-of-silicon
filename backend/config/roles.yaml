    goal: "Lynch every criminal and evildoer"
    abilities:
      - name: "Investigate"
        description: "Learn a player's possible roles (set of 3)"
        action_type: "investigate"
        priority: 4
        max_uses: null
        cooldown_nights: 0
        targets_required: 1
    immunities: []

  lookout:
    id: "lookout"
    name: "Lookout"
    faction: "Town"
    category: "Town Investigative"
    alignment: "Town Investigative"
    attack: 0
    defense: 0
