    id: "sheriff"
    name: "Sheriff"
    faction: "Town"
    category: "Town Investigative"
    alignment: "Town Investigative"
    attack: 0
    defense: 0
    unique: false
    summary: "Interrogate players to find evil-doers"
    goal: "Lynch every criminal and evildoer"
    abilities:
      - name: "Interrogate"
        description: "Check if a player is suspicious (Mafia/NK/Werewolf)"
        action_type: "investigate"
        priority: 4
        max_uses: null
        cooldown_nights: 0
        targets_required: 1
    immunities: []

  investigator:
    id: "investigator"
    name: "Investigator"
    faction: "Town"
    category: "Town Investigative"
    alignment: "Town Investigative"
    attack: 0
    defense: 0
